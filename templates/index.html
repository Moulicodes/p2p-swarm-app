<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid P2P Swarm File Transfer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Socket.IO Client Library -->
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Hybrid P2P Swarm Node</h1>
            <p id="node-status" class="status-offline">Connecting to Tracker...</p>
        </header>

        <main class="grid-layout">
            <!-- Seeder Section -->
            <section class="card">
                <h2>Seeder Mode (Upload File)</h2>
                <div class="input-group">
                    <input type="file" id="file-input">
                    <button id="seed-btn" onclick="registerAndSeedFile()">Seed File to Swarm</button>
                </div>
                <div id="seed-info" class="info-box hidden">
                    <p><strong>File Hash:</strong> <span id="seed-file-hash">-</span></p>
                    <p><strong>Chunks Generated:</strong> <span id="seed-chunk-count">0</span></p>
                </div>
            </section>

            <!-- Leecher Section -->
            <section class="card">
                <h2>Leecher Mode (Download File)</h2>
                <div class="input-group">
                    <input type="text" id="hash-input" placeholder="Enter Target File Hash">
                    <button id="join-btn" onclick="joinSwarmAndDownload()">Join Swarm & Download</button>
                </div>
                <div id="download-progress-box" class="info-box hidden">
                    <p><strong>Filename:</strong> <span id="dl-filename">-</span></p>
                    <div class="progress-bar-container">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <p><span id="dl-progress-text">0%</span> (<span id="dl-chunks-text">0/0</span> Chunks)</p>
                </div>
            </section>

            <!-- Swarm Telemetry Section -->
            <section class="card full-width">
                <h2>Active Swarm Telemetry & Chunk Metrics</h2>
                <div class="telemetry-grid">
                    <div>
                        <h3>Connected Peers & Download Breakdown</h3>
                        <ul id="peer-list" class="peer-list">
                            <li class="empty-msg">No active swarm connections.</li>
                        </ul>
                    </div>
                    <div>
                        <h3>System Event Log</h3>
                        <div id="log-window" class="log-window"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- P2P Logic Scripts -->
    <script src="{{ url_for('static', filename='js/socket_signaling.js') }}"></script>
    <script src="{{ url_for('static', filename='js/webrtc_engine.js') }}"></script>
</body>
</html>
